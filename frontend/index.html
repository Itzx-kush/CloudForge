<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CloudForge — Self-Service Cloud Deployment and DevOps Automation Platform"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the stored palette before the first stylesheet paints.
      let appearance;
      try { appearance = JSON.parse(localStorage.getItem('cloudforge.appearance.v1')); } catch {}
      const scheme = appearance?.theme;
      document.documentElement.dataset.theme = scheme === 'dark' || scheme === 'light'
        ? scheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.accent = appearance?.accent || 'blue';
    </script>
    <title>CloudForge — Cloud Deployment &amp; DevOps Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
