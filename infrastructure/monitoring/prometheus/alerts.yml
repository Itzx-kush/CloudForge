groups:
- name: cloudforge
  rules:
  - alert: TargetUnavailable
    expr: up == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Scrape target unavailable
      runbook_url: https://github.com/Itzx-kush/CloudForge/blob/main/docs/OBSERVABILITY.md
  - alert: DatabaseUnavailable
    expr: pg_up == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Exporter cannot reach PostgreSQL
      runbook_url: https://github.com/Itzx-kush/CloudForge/blob/main/docs/OBSERVABILITY.md
  - alert: BackendHighErrorRate
    expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])),
      0.1) > 0.05
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Backend error rate exceeds five percent
      runbook_url: https://github.com/Itzx-kush/CloudForge/blob/main/docs/OBSERVABILITY.md
  - alert: BackendHighLatency
    expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))
      > 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: API p95 latency exceeds one second
      runbook_url: https://github.com/Itzx-kush/CloudForge/blob/main/docs/OBSERVABILITY.md
  - alert: ConnectionPoolSaturation
    expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Database pool exceeds ninety percent utilization
      runbook_url: https://github.com/Itzx-kush/CloudForge/blob/main/docs/OBSERVABILITY.md
  - alert: WorkerHeartbeatStale
    expr: time() - cloudforge_worker_last_heartbeat_seconds > 90
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Worker has stopped reporting successful heartbeats
      runbook_url: https://github.com/Itzx-kush/CloudForge/blob/main/docs/OBSERVABILITY.md
  - alert: WorkerHeartbeatFailures
    expr: increase(cloudforge_worker_heartbeat_failures_total[5m]) > 3
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Repeated worker heartbeat errors
      runbook_url: https://github.com/Itzx-kush/CloudForge/blob/main/docs/OBSERVABILITY.md
  - alert: PipelineFailures
    expr: sum(increase(cloudforge_operations_total{action="PIPELINE_RUN_FAILED"}[10m]))
      >= 3
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Repeated failed pipeline runs
      runbook_url: https://github.com/Itzx-kush/CloudForge/blob/main/docs/OBSERVABILITY.md
