apiVersion: v1
kind: LimitRange
metadata:
  name: cloudforge-container-limits
  namespace: cf-example-app-dev
  labels:
    app.kubernetes.io/managed-by: cloudforge
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      min:
        cpu: "10m"
        memory: "32Mi"
      max:
        cpu: "2"
        memory: "2Gi"
