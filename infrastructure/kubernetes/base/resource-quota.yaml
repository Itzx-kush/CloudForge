apiVersion: v1
kind: ResourceQuota
metadata:
  name: cloudforge-namespace-quota
  namespace: cf-example-app-dev
  labels:
    app.kubernetes.io/managed-by: cloudforge
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: "4Gi"
    limits.cpu: "8"
    limits.memory: "8Gi"
    services: "10"
    services.loadbalancers: "0"
    services.nodeports: "0"
