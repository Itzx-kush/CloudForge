name: CloudForge CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Test & Package (Java 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cloudforge
          POSTGRES_USER: cloudforge
          POSTGRES_PASSWORD: cloudforge_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloudforge -d cloudforge"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven unit & integration tests (including PostgreSQL 17 regression suite)
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/cloudforge
          TEST_POSTGRES_USER: cloudforge
          TEST_POSTGRES_PASSWORD: cloudforge_ci_password
          TEST_POSTGRES_RUN_FLYWAY: "true"
        run: mvn -B test

      - name: Build executable JAR
        run: mvn -B package -DskipTests

  frontend:
    name: Frontend Test, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  worker:
    name: Worker Test & Real Docker Isolation Verification (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Pre-pull pinned minimal executor image (alpine:3.20)
        run: docker pull alpine:3.20

      - name: Run worker unit and real Docker isolated execution tests
        run: mvn -B test

      - name: Package standalone worker executable JAR
        run: mvn -B package -DskipTests
