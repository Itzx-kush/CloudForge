name: CloudForge CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Test & Package (Java 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cloudforge
          POSTGRES_USER: cloudforge
          POSTGRES_PASSWORD: cloudforge_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloudforge -d cloudforge"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven unit & integration tests (including PostgreSQL 17 regression suite)
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/cloudforge
          TEST_POSTGRES_USER: cloudforge
          TEST_POSTGRES_PASSWORD: cloudforge_ci_password
          TEST_POSTGRES_RUN_FLYWAY: "true"
        run: mvn -B test

      - name: Build executable JAR
        run: mvn -B package -DskipTests

  frontend:
    name: Frontend Test, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  worker:
    name: Worker Test & Real Docker Isolation Verification (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Pre-pull pinned minimal executor image (alpine:3.20) and local OCI test registry (registry:2)
        run: |
          docker pull alpine:3.20
          docker pull registry:2

      - name: Run worker unit and real Docker isolated execution tests
        run: mvn -B test

      - name: Package standalone worker executable JAR
        run: mvn -B package -DskipTests

      - name: Verify rollback and read-only recovery in disposable Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          kind_bin="$RUNNER_TEMP/cloudforge-kind"
          export KUBECONFIG="$RUNNER_TEMP/cloudforge-phase37.kubeconfig"
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.26.0/kind-linux-amd64 \
            -o "$kind_bin"
          chmod +x "$kind_bin"
          trap '"$kind_bin" delete cluster --name cloudforge-phase37' EXIT
          "$kind_bin" create cluster --name cloudforge-phase37 --image kindest/node:v1.31.2 --wait 120s
          kubectl version
          export CLOUDFORGE_K8S_E2E_NAMESPACE=cf-phase37-e2e
          bash ../infrastructure/kubernetes/local/provision-local-namespace.sh "$CLOUDFORGE_K8S_E2E_NAMESPACE" 30m
          export CLOUDFORGE_K8S_E2E_API_URL="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          export CLOUDFORGE_K8S_E2E_CA_FILE="$RUNNER_TEMP/cloudforge-phase37-ca.pem"
          kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > "$CLOUDFORGE_K8S_E2E_CA_FILE"
          export CLOUDFORGE_K8S_E2E_TOKEN="$(kubectl -n "$CLOUDFORGE_K8S_E2E_NAMESPACE" create token cloudforge-deployer --duration=30m)"
          echo "::add-mask::$CLOUDFORGE_K8S_E2E_TOKEN"
          export CLOUDFORGE_K8S_E2E_IMAGE_DIGEST=sha256:24528cf5229d0b70065ac27e6c9e4d96f5452a84a3ce4433e56573c18d96827a
          export CLOUDFORGE_K8S_E2E_IMAGE_REF="ghcr.io/mccutchen/go-httpbin@$CLOUDFORGE_K8S_E2E_IMAGE_DIGEST"
          export CLOUDFORGE_K8S_E2E_SECOND_IMAGE_REF=ghcr.io/mccutchen/go-httpbin@sha256:2b02b8844eab42d432d9c4bbd96a20d7ff348292097eeee4546e79252f72c70e
          export CLOUDFORGE_K8S_E2E_PROBE_PATH=/status/200
          mvn -B -Dtest=RealLocalKubernetesEndToEndTest test

  phase4:
    name: Monitoring and supply-chain verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.69.3
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
        with:
          cosign-release: v2.5.3
      - name: Validate monitoring configuration
        run: |
          docker run --rm -v "$PWD/infrastructure/monitoring/prometheus:/etc/prometheus:ro" -v /dev/null:/run/secrets/metrics_token:ro --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infrastructure/monitoring/alertmanager:/etc/alertmanager:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
          jq -e '.panels | length > 0' infrastructure/monitoring/grafana/dashboards/*.json
      - name: Build frontend image and verify deep links
        run: |
          docker build -t cloudforge-frontend:ci frontend
          docker run -d --name frontend --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:8090:8080 cloudforge-frontend:ci
          curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://localhost:8090/monitoring -o "$RUNNER_TEMP/frontend.html" || { docker logs frontend; exit 1; }
          grep -q 'id="root"' "$RUNNER_TEMP/frontend.html"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/auth/me)" = 404
          docker save -o "$RUNNER_TEMP/frontend.tar" cloudforge-frontend:ci
      - name: Verify SBOM integrity with disposable signing identity
        env:
          COSIGN_PASSWORD: ""
        run: |
          cd "$RUNNER_TEMP"
          trivy image --input frontend.tar --format cyclonedx --output sbom.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' sbom.json
          cosign generate-key-pair
          cosign sign-blob --yes --key cosign.key --tlog-upload=false --output-signature sbom.sig sbom.json
          cosign verify-blob --key cosign.pub --insecure-ignore-tlog --signature sbom.sig sbom.json
          echo ' ' >> sbom.json
          if cosign verify-blob --key cosign.pub --insecure-ignore-tlog --signature sbom.sig sbom.json; then exit 1; fi
      - name: Scan source dependencies and secrets, then scan frontend image
        run: |
          set -euo pipefail
          rejected=0
          for target in source image; do
            report="$RUNNER_TEMP/$target-scan.json"
            if [[ "$target" == source ]]; then
              trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --format json --output "$report" .
            else
              trivy image --input "$RUNNER_TEMP/frontend.tar" --scanners vuln,secret --severity HIGH,CRITICAL --format json --output "$report"
            fi
            count=$(jq '[.Results[]? | (.Vulnerabilities[]?, .Secrets[]?)] | length' "$report")
            echo "$target high or critical findings: $count" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$count" != 0 ]]; then
              jq -r '.Results[]? | .Target as $path | (.Vulnerabilities[]? | [$path,.PkgName,.InstalledVersion,.VulnerabilityID,.FixedVersion]), (.Secrets[]? | [$path,.RuleID]) | @tsv' "$report" | sort -u
              echo "::error::Security policy rejected $target"
              rejected=1
            fi
          done
          test "$rejected" = 0
