name: cloudforge

services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudforge}
      POSTGRES_USER: ${POSTGRES_USER:-cloudforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudforge_local_dev_password}
    ports:
      # Localhost-only binding: database is never exposed to external networks.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cloudforge_postgres_data:/var/lib/postgresql/data
    networks:
      - cloudforge-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cloudforge} -d ${POSTGRES_DB:-cloudforge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudforge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudforge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cloudforge_local_dev_password}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      CLOUDFORGE_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CLOUDFORGE_FRONTEND_BASE_URL: ${CLOUDFORGE_FRONTEND_BASE_URL:-http://localhost:5173}
      CLOUDFORGE_ALLOWED_REDIRECT_ORIGINS: ${CLOUDFORGE_ALLOWED_REDIRECT_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CLOUDFORGE_COOKIE_SECURE: ${CLOUDFORGE_COOKIE_SECURE:-false}
      CLOUDFORGE_COOKIE_SAME_SITE: ${CLOUDFORGE_COOKIE_SAME_SITE:-lax}
      CLOUDFORGE_SESSION_TIMEOUT: ${CLOUDFORGE_SESSION_TIMEOUT:-8h}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-{baseUrl}/login/oauth2/code/{registrationId}}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-http://localhost:5173/api/github/app/callback}
      # Phase 3.3 worker control plane — disabled by default; backend container NEVER mounts docker.sock.
      CLOUDFORGE_WORKERS_ENABLED: ${CLOUDFORGE_WORKERS_ENABLED:-false}
      CLOUDFORGE_WORKERS_SCHEDULER_ENABLED: ${CLOUDFORGE_WORKERS_SCHEDULER_ENABLED:-false}
      CLOUDFORGE_WORKER_CREDENTIALS: ${CLOUDFORGE_WORKER_CREDENTIALS:-}
      # Phase 3.4 encrypted secret management — fail-closed defaults unless externally configured.
      CLOUDFORGE_SECRETS_ENABLED: ${CLOUDFORGE_SECRETS_ENABLED:-false}
      CLOUDFORGE_SECRETS_KEY_PROVIDER: ${CLOUDFORGE_SECRETS_KEY_PROVIDER:-env-keyring}
      CLOUDFORGE_SECRETS_ACTIVE_KEY_ID: ${CLOUDFORGE_SECRETS_ACTIVE_KEY_ID:-}
      CLOUDFORGE_SECRETS_KEYRING: ${CLOUDFORGE_SECRETS_KEYRING:-}
      CLOUDFORGE_SECRETS_WORKER_DELIVERY_ENABLED: ${CLOUDFORGE_SECRETS_WORKER_DELIVERY_ENABLED:-false}
      CLOUDFORGE_SECRETS_ALLOW_INSECURE_LOCAL_DELIVERY: ${CLOUDFORGE_SECRETS_ALLOW_INSECURE_LOCAL_DELIVERY:-false}
      CLOUDFORGE_SECRETS_OPERATOR_ROTATION_ENABLED: ${CLOUDFORGE_SECRETS_OPERATOR_ROTATION_ENABLED:-false}
      CLOUDFORGE_SECRETS_OPERATOR_ROTATION_TOKEN: ${CLOUDFORGE_SECRETS_OPERATOR_ROTATION_TOKEN:-}
      CLOUDFORGE_SOURCE_ACQUISITION_ENABLED: ${CLOUDFORGE_SOURCE_ACQUISITION_ENABLED:-false}
      CLOUDFORGE_SOURCE_ALLOWED_REPOSITORY_IDS: ${CLOUDFORGE_SOURCE_ALLOWED_REPOSITORY_IDS:-}
      CLOUDFORGE_SOURCE_ALLOWED_WORKER_IDS: ${CLOUDFORGE_SOURCE_ALLOWED_WORKER_IDS:-}
      # Phase 3.5B OCI container builds & registry publishing — disabled by default; backend never runs BuildKit or mounts docker.sock.
      CLOUDFORGE_OCI_ENABLED: ${CLOUDFORGE_OCI_ENABLED:-false}
      CLOUDFORGE_OCI_ALLOW_LOCAL_DEV_REGISTRY: ${CLOUDFORGE_OCI_ALLOW_LOCAL_DEV_REGISTRY:-false}
      CLOUDFORGE_OCI_ALLOW_INSECURE_LOCAL_CREDENTIAL_DELIVERY: ${CLOUDFORGE_OCI_ALLOW_INSECURE_LOCAL_CREDENTIAL_DELIVERY:-false}
      CLOUDFORGE_OCI_ALLOWED_REGISTRY_HOSTS: ${CLOUDFORGE_OCI_ALLOWED_REGISTRY_HOSTS:-}
      CLOUDFORGE_OCI_ALLOWED_WORKER_IDS: ${CLOUDFORGE_OCI_ALLOWED_WORKER_IDS:-}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - cloudforge-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  cloudforge_postgres_data:
    name: cloudforge_postgres_data

networks:
  cloudforge-net:
    name: cloudforge-net
    driver: bridge
