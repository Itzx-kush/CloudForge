spring:
  datasource:
    url: jdbc:h2:mem:cloudforge_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
      jakarta:
        persistence:
          database-product-name: H2
