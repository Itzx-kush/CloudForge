# Render-specific values only. Local Docker Compose uses the unchanged application.yml.
server:
  port: ${PORT:10000}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Free Render PostgreSQL can take several seconds to authorize a new
      # connection. The global local-development timeout is only 3 seconds.
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1

# Render web services have no Docker daemon and must never activate local worker execution or worker secret delivery.
management:
  tracing:
    enabled: false

cloudforge:
  source:
    enabled: false
  workers:
    enabled: false
    scheduler-enabled: false
  secrets:
    worker-delivery-enabled: false
    allow-insecure-local-delivery: false
  oci:
    enabled: false
    allow-local-dev-registry: false
    allow-insecure-local-credential-delivery: false
  kubernetes:
    enabled: false
    allow-local-dev-clusters: false
    allow-insecure-local-credential-delivery: false
    allow-production-deployments: false
