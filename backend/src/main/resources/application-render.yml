# Render-specific values only. Local Docker Compose uses the unchanged application.yml.
server:
  port: ${PORT:10000}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Free Render PostgreSQL can take several seconds to authorize a new
      # connection. The global local-development timeout is only 3 seconds.
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1

# Render web services have no Docker daemon and must never activate local worker execution.
cloudforge:
  workers:
    enabled: false
    scheduler-enabled: false
