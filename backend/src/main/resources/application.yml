server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${CLOUDFORGE_SESSION_TIMEOUT:8h}
      tracking-modes: cookie
      cookie:
        name: CLOUDFORGE_SESSION
        http-only: true
        same-site: ${CLOUDFORGE_COOKIE_SAME_SITE:lax}
        secure: ${CLOUDFORGE_COOKIE_SECURE:false}
        path: /
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: cloudforge-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudforge}
    username: ${SPRING_DATASOURCE_USERNAME:cloudforge}
    password: ${SPRING_DATASOURCE_PASSWORD:cloudforge_local_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: cloudforge-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1200000
      initialization-fail-timeout: -1

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
      jakarta:
        persistence:
          database-product-name: PostgreSQL

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${cloudforge.name}
    version: ${cloudforge.version}
    phase: ${cloudforge.phase}

cloudforge:
  name: CloudForge Backend
  version: 0.2.0-phase2
  phase: Phase 2 — Identity, GitHub Integration & Persistent Workspaces
  database-check-timeout-seconds: 3
  cors:
    allowed-origins: ${CLOUDFORGE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    frontend-base-url: ${CLOUDFORGE_FRONTEND_BASE_URL:http://localhost:5173}
    allowed-redirect-origins: ${CLOUDFORGE_ALLOWED_REDIRECT_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cookie-secure: ${CLOUDFORGE_COOKIE_SECURE:false}
    github-oauth:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
  github-app:
    app-id: ${GITHUB_APP_ID:}
    slug: ${GITHUB_APP_SLUG:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    installation-callback-url: ${GITHUB_APP_CALLBACK_URL:http://localhost:5173/api/github/app/callback}
    api-connect-timeout-seconds: ${GITHUB_API_CONNECT_TIMEOUT_SECONDS:5}
    api-read-timeout-seconds: ${GITHUB_API_READ_TIMEOUT_SECONDS:10}
    actions-sync-max-workflow-pages: ${GITHUB_ACTIONS_SYNC_MAX_WORKFLOW_PAGES:5}
    actions-sync-max-runs-per-repo: ${GITHUB_ACTIONS_SYNC_MAX_RUNS_PER_REPO:50}
    actions-sync-per-page: ${GITHUB_ACTIONS_SYNC_PER_PAGE:50}
    actions-sync-max-job-pages: ${GITHUB_ACTIONS_SYNC_MAX_JOB_PAGES:3}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.cloudforge.backend: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
